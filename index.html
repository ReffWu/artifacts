<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reff · Artifacts</title>
  <meta name="description" content="实地调研、决策指南与交互工具。">
  <style>
    :root {
      --bg: #000000;
      --card: #0c0c0d;
      --card-hover: #121214;
      --stroke: rgba(255, 255, 255, 0.08);
      --stroke-hover: rgba(255, 255, 255, 0.16);
      --hairline: rgba(255, 255, 255, 0.06);

      --text: #f5f5f7;
      --text-dim: rgba(245, 245, 247, 0.65);
      --text-faint: rgba(245, 245, 247, 0.40);

      --accent: #5cc8ec;
      --font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      font-size: 15px;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    ::selection {
      background: var(--accent);
      color: #000;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .shell {
      width: 100%;
      max-width: 960px;
      margin: 0 auto;
      padding: 0 1.5rem;
    }

    /* Header */
    header.top-bar {
      padding: 2.5rem 0 1.5rem;
      border-bottom: 1px solid var(--hairline);
    }

    .brand {
      display: flex;
      align-items: baseline;
      gap: 0.5rem;
    }

    .brand h1 {
      font-size: 1.5rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      color: var(--text);
    }

    .brand span {
      font-size: 0.85rem;
      color: var(--text-faint);
    }

    .tagline {
      margin-top: 0.4rem;
      font-size: 0.92rem;
      color: var(--text-dim);
    }

    /* Artifacts List */
    main {
      padding: 2.5rem 0 4rem;
      flex: 1;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 1.5rem;
    }

    @media (min-width: 640px) {
      .grid {
        grid-template-columns: repeat(auto-fill, minmax(420px, 1fr));
      }
    }

    .card {
      background: var(--card);
      border: 1px solid var(--stroke);
      border-radius: 14px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: border-color 0.2s, background-color 0.2s, transform 0.2s;
    }

    .card:hover {
      background: var(--card-hover);
      border-color: var(--stroke-hover);
      transform: translateY(-2px);
    }

    .card-photo {
      aspect-ratio: 16 / 10;
      width: 100%;
      background: #050505;
      overflow: hidden;
      border-bottom: 1px solid var(--hairline);
    }

    .card-photo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.35s ease;
    }

    .card:hover .card-photo img {
      transform: scale(1.02);
    }

    .card-body {
      padding: 1.25rem 1.4rem 1.4rem;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .card-meta {
      font-size: 0.78rem;
      color: var(--text-faint);
      margin-bottom: 0.4rem;
    }

    .card h2 {
      font-size: 1.18rem;
      font-weight: 600;
      letter-spacing: -0.015em;
      color: var(--text);
      line-height: 1.35;
      margin-bottom: 0.5rem;
    }

    .card p {
      font-size: 0.88rem;
      color: var(--text-dim);
      line-height: 1.55;
      margin-bottom: 1.25rem;
    }

    .card-foot {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-top: 0.85rem;
      border-top: 1px solid var(--hairline);
      font-size: 0.82rem;
    }

    .card-foot .tag {
      color: var(--text-faint);
    }

    .card-foot .action {
      color: var(--accent);
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 0.25rem;
      transition: gap 0.15s;
    }

    .card:hover .action {
      gap: 0.45rem;
    }

    /* Footer */
    footer {
      border-top: 1px solid var(--hairline);
      padding: 2rem 0;
      font-size: 0.8rem;
      color: var(--text-faint);
    }

    .foot-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
  </style>
</head>
<body>

  <header class="top-bar">
    <div class="shell">
      <div class="brand">
        <h1>Reff</h1>
        <span>/ Artifacts</span>
      </div>
      <p class="tagline">实地调研、决策指南与交互工具。</p>
    </div>
  </header>

  <main class="shell">
    <div class="grid">

      <!-- Item 1: Detroit Dining Field Guide -->
      <a href="./detroit-dining/" class="card">
        <div class="card-photo">
          <img src="./detroit-dining/photos/louis_pizza.jpg" alt="底特律聚餐指南">
        </div>
        <div class="card-body">
          <div>
            <div class="card-meta">2026.09 · 探店决策</div>
            <h2>底特律近郊 4 人聚餐指南</h2>
            <p>以 Fraser 为中心 30 分钟自驾圈，人均 $30 内。14 家全现场实拍、真实口碑核实、4 人推荐硬菜与预算清单。</p>
          </div>
          <div class="card-foot">
            <span class="tag">14 家餐厅核查</span>
            <span class="action">查看指南 →</span>
          </div>
        </div>
      </a>

    </div>
  </main>

  <footer>
    <div class="shell foot-inner">
      <span>Reff · Artifacts</span>
      <span>2026</span>
    </div>
  </footer>

</body>
</html>
