<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reff · Artifacts</title>
  <meta name="description" content="实地调研、决策指南与交互工具。">
  <script>
    // Initialize theme immediately to prevent flash
    (function() {
      const saved = localStorage.getItem('reff_theme');
      if (saved) {
        document.documentElement.setAttribute('data-theme', saved);
      }
    })();
  </script>
  <style>
    /* Dark Theme (Default Baseline) */
    :root {
      --bg: #000000;
      --card: #0c0c0d;
      --card-hover: #121214;
      --surface: rgba(255, 255, 255, 0.04);
      --stroke: rgba(255, 255, 255, 0.08);
      --stroke-hover: rgba(255, 255, 255, 0.16);
      --hairline: rgba(255, 255, 255, 0.06);

      --text: #f5f5f7;
      --text-dim: rgba(245, 245, 247, 0.65);
      --text-faint: rgba(245, 245, 247, 0.40);

      --accent: #5cc8ec;
      --font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    }

    /* Light Theme (Auto system preference if not manually overridden) */
    @media (prefers-color-scheme: light) {
      :root:not([data-theme="dark"]) {
        --bg: #ffffff;
        --card: #f8f9fa;
        --card-hover: #f1f3f5;
        --surface: rgba(0, 0, 0, 0.04);
        --stroke: rgba(0, 0, 0, 0.08);
        --stroke-hover: rgba(0, 0, 0, 0.16);
        --hairline: rgba(0, 0, 0, 0.07);

        --text: #1d1d1f;
        --text-dim: #515154;
        --text-faint: #86868b;

        --accent: #0077b6;
      }
    }

    /* Explicit Light Theme via Toggle */
    html[data-theme="light"] {
      --bg: #ffffff;
      --card: #f8f9fa;
      --card-hover: #f1f3f5;
      --surface: rgba(0, 0, 0, 0.04);
      --stroke: rgba(0, 0, 0, 0.08);
      --stroke-hover: rgba(0, 0, 0, 0.16);
      --hairline: rgba(0, 0, 0, 0.07);

      --text: #1d1d1f;
      --text-dim: #515154;
      --text-faint: #86868b;

      --accent: #0077b6;
    }

    /* Explicit Dark Theme via Toggle */
    html[data-theme="dark"] {
      --bg: #000000;
      --card: #0c0c0d;
      --card-hover: #121214;
      --surface: rgba(255, 255, 255, 0.04);
      --stroke: rgba(255, 255, 255, 0.08);
      --stroke-hover: rgba(255, 255, 255, 0.16);
      --hairline: rgba(255, 255, 255, 0.06);

      --text: #f5f5f7;
      --text-dim: rgba(245, 245, 247, 0.65);
      --text-faint: rgba(245, 245, 247, 0.40);

      --accent: #5cc8ec;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      font-size: 15px;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: background-color 0.25s ease, color 0.25s ease;
    }

    ::selection {
      background: var(--accent);
      color: #000;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .shell {
      width: 100%;
      max-width: 960px;
      margin: 0 auto;
      padding: 0 1.5rem;
    }

    /* Header */
    header.top-bar {
      padding: 2.2rem 0 1.5rem;
      border-bottom: 1px solid var(--hairline);
    }

    .header-row {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
    }

    .brand {
      display: flex;
      align-items: baseline;
      gap: 0.5rem;
    }

    .brand h1 {
      font-size: 1.5rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      color: var(--text);
    }

    .brand span {
      font-size: 0.85rem;
      color: var(--text-faint);
    }

    .tagline {
      margin-top: 0.4rem;
      font-size: 0.92rem;
      color: var(--text-dim);
    }

    /* Theme Toggle */
    .theme-toggle {
      background: var(--surface);
      border: 1px solid var(--stroke);
      color: var(--text);
      cursor: pointer;
      width: 34px;
      height: 34px;
      border-radius: 8px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
      padding: 0;
      flex-shrink: 0;
    }

    .theme-toggle:hover {
      border-color: var(--stroke-hover);
      color: var(--accent);
    }

    .theme-toggle svg {
      width: 16px;
      height: 16px;
      fill: currentColor;
    }

    /* Artifacts List */
    main {
      padding: 2.5rem 0 4rem;
      flex: 1;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 1.5rem;
    }

    @media (min-width: 640px) {
      .grid {
        grid-template-columns: repeat(auto-fill, minmax(420px, 1fr));
      }
    }

    .card {
      background: var(--card);
      border: 1px solid var(--stroke);
      border-radius: 14px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: border-color 0.2s, background-color 0.2s, transform 0.2s;
    }

    .card:hover {
      background: var(--card-hover);
      border-color: var(--stroke-hover);
      transform: translateY(-2px);
    }

    .card-photo {
      aspect-ratio: 16 / 10;
      width: 100%;
      background: var(--surface);
      overflow: hidden;
      border-bottom: 1px solid var(--hairline);
    }

    .card-photo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.35s ease;
    }

    .card:hover .card-photo img {
      transform: scale(1.02);
    }

    .card-body {
      padding: 1.25rem 1.4rem 1.4rem;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .card-meta {
      font-size: 0.78rem;
      color: var(--text-faint);
      margin-bottom: 0.4rem;
    }

    .card h2 {
      font-size: 1.18rem;
      font-weight: 600;
      letter-spacing: -0.015em;
      color: var(--text);
      line-height: 1.35;
      margin-bottom: 0.5rem;
    }

    .card p {
      font-size: 0.88rem;
      color: var(--text-dim);
      line-height: 1.55;
      margin-bottom: 1.25rem;
    }

    .card-foot {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-top: 0.85rem;
      border-top: 1px solid var(--hairline);
      font-size: 0.82rem;
    }

    .card-foot .tag {
      color: var(--text-faint);
    }

    .card-foot .action {
      color: var(--accent);
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 0.25rem;
      transition: gap 0.15s;
    }

    .card:hover .action {
      gap: 0.45rem;
    }

    /* Footer */
    footer {
      border-top: 1px solid var(--hairline);
      padding: 2rem 0;
      font-size: 0.8rem;
      color: var(--text-faint);
    }

    .foot-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
  </style>
</head>
<body>

  <header class="top-bar">
    <div class="shell">
      <div class="header-row">
        <div>
          <div class="brand">
            <h1>Reff</h1>
            <span>/ Artifacts</span>
          </div>
          <p class="tagline">实地调研、决策指南与交互工具。</p>
        </div>
        <button id="themeToggle" class="theme-toggle" aria-label="切换深浅主题" title="点击切换深色 / 浅色模式">
          <svg id="themeIconSun" style="display:none;" viewBox="0 0 24 24"><path d="M12 7c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-5zM2 13h2c.55 0 1-.45 1-1s-.45-1-1-1H2c-.55 0-1 .45-1 1s.45 1 1 1zm18 0h2c.55 0 1-.45 1-1s-.45-1-1-1h-2c-.55 0-1 .45-1 1s.45 1 1 1zM11 2v2c0 .55.45 1 1 1s1-.45 1-1V2c0-.55-.45-1-1-1s-1 .45-1 1zm0 18v2c0 .55.45 1 1 1s1-.45 1-1v-2c0-.55-.45-1-1-1s-1 .45-1 1zM5.99 4.58c-.39-.39-1.03-.39-1.41 0s-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.03 0-1.41L5.99 4.58zm12.37 12.37c-.39-.39-1.03-.39-1.41 0s-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.03 0-1.41l-1.06-1.06zm1.06-10.96c.39-.39.39-1.03 0-1.41s-1.03-.39-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06zM7.05 18.36c.39-.39.39-1.03 0-1.41s-1.03-.39-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06z"/></svg>
          <svg id="themeIconMoon" viewBox="0 0 24 24"><path d="M12.3 2a10 10 0 0 0-.19 20 10.04 10.04 0 0 0 9.79-7.77 1 1 0 0 0-1.21-1.22A8 8 0 1 1 11.29 3.2 1 1 0 0 0 12.3 2z"/></svg>
        </button>
      </div>
    </div>
  </header>

  <main class="shell">
    <div class="grid">

      <!-- Item 1: Detroit Dining Field Guide -->
      <a href="./detroit-dining/" class="card">
        <div class="card-photo">
          <img src="./detroit-dining/photos/miss_changan.jpg" alt="底特律近郊聚餐深度指南">
        </div>
        <div class="card-body">
          <div>
            <div class="card-meta">2026.09 · 探店决策</div>
            <h2>底特律近郊 4 人聚餐深度指南</h2>
            <p>Fraser 30 分钟自驾圈、人均 $30 内。精选 6 家正统风味老店（正宗川菜、陕西扯面夹馍、也门慢炖羊肉、拉面生煎、韩式烤肉、日式拉面），深度风味解析与实战点单。</p>
          </div>
          <div class="card-foot">
            <span class="tag">精选 6 店深度版</span>
            <span class="action">查看指南 →</span>
          </div>
        </div>
      </a>

    </div>
  </main>

  <footer>
    <div class="shell foot-inner">
      <span>Reff · Artifacts</span>
      <span>2026</span>
    </div>
  </footer>

  <script>
    // Theme Toggle Logic
    const themeBtn = document.getElementById('themeToggle');
    const sunIcon = document.getElementById('themeIconSun');
    const moonIcon = document.getElementById('themeIconMoon');

    function updateThemeIcons(isLight) {
      if (isLight) {
        sunIcon.style.display = 'none';
        moonIcon.style.display = 'block';
      } else {
        sunIcon.style.display = 'block';
        moonIcon.style.display = 'none';
      }
    }

    function getCurrentThemeIsLight() {
      const explicit = document.documentElement.getAttribute('data-theme');
      if (explicit === 'light') return true;
      if (explicit === 'dark') return false;
      return window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches;
    }

    // Initialize icon
    updateThemeIcons(getCurrentThemeIsLight());

    themeBtn.addEventListener('click', () => {
      const isCurrentlyLight = getCurrentThemeIsLight();
      const newTheme = isCurrentlyLight ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', newTheme);
      localStorage.setItem('reff_theme', newTheme);
      updateThemeIcons(newTheme === 'light');
    });

    // Listen to system preference changes if user hasn't explicitly set localStorage
    if (window.matchMedia) {
      window.matchMedia('(prefers-color-scheme: light)').addEventListener('change', (e) => {
        if (!localStorage.getItem('reff_theme')) {
          updateThemeIcons(e.matches);
        }
      });
    }
  </script>
</body>
</html>
