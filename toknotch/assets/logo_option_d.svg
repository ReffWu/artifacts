<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Deep Obsidian Radial -->
    <radialGradient id="bgD" cx="512" cy="400" r="500" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#242630"/>
      <stop offset="60%" stop-color="#0E0F14"/>
      <stop offset="100%" stop-color="#050507"/>
    </radialGradient>
    <linearGradient id="rimD" x1="512" y1="96" x2="512" y2="928" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="rgba(255,255,255,0.4)"/>
      <stop offset="30%" stop-color="rgba(255,255,255,0.06)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.02)"/>
    </linearGradient>
    <filter id="shadowD" x="0" y="30" width="1024" height="964">
      <feDropShadow dx="0" dy="28" stdDeviation="36" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    <linearGradient id="amberGlow" x1="300" y1="350" x2="720" y2="770" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
  </defs>

  <!-- Squircle Base -->
  <g filter="url(#shadowD)">
    <rect x="96" y="96" width="832" height="832" rx="192" fill="url(#bgD)"/>
    <rect x="97" y="97" width="830" height="830" rx="191" stroke="url(#rimD)" stroke-width="2.5" fill="none"/>
  </g>

  <!-- Hardware Notch Top Cutout -->
  <path d="M 330 96 
           C 362 96, 376 122, 382 144 
           L 390 178 
           C 398 214, 420 236, 456 236 
           L 568 236 
           C 604 236, 626 214, 634 178 
           L 642 144 
           C 648 122, 662 96, 694 96 
           Z" 
        fill="#000000"/>
  <path d="M 330 96 
           C 362 96, 376 122, 382 144 
           L 390 178 
           C 398 214, 420 236, 456 236 
           L 568 236 
           C 604 236, 626 214, 634 178 
           L 642 144 
           C 648 122, 662 96, 694 96" 
        stroke="rgba(255,255,255,0.2)" stroke-width="2" fill="none"/>

  <!-- Glass Inner Glow Orb -->
  <circle cx="512" cy="560" r="190" fill="#0E1017" stroke="rgba(255,255,255,0.1)" stroke-width="2"/>
  
  <!-- Sleek Minimal Activity Arc -->
  <circle cx="512" cy="560" r="150" stroke="rgba(255,255,255,0.06)" stroke-width="18" fill="none"/>
  <path d="M 512 410 A 150 150 0 1 1 366 598" stroke="url(#amberGlow)" stroke-width="18" stroke-linecap="round" fill="none"/>
  <circle cx="366" cy="598" r="9" fill="#FFFBEB"/>

  <!-- Central Token Precision Crystal -->
  <polygon points="512,505 558,535 558,585 512,615 466,585 466,535" fill="none" stroke="rgba(255,255,255,0.8)" stroke-width="3"/>
  <circle cx="512" cy="560" r="6" fill="#F59E0B"/>
</svg>
