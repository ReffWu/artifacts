<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgC" x1="512" y1="96" x2="512" y2="928" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#141519"/>
      <stop offset="60%" stop-color="#090A0D"/>
      <stop offset="100%" stop-color="#020203"/>
    </linearGradient>
    <linearGradient id="rimC" x1="512" y1="96" x2="512" y2="928" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="rgba(255,255,255,0.22)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.02)"/>
    </linearGradient>
    <filter id="shadowC" x="0" y="30" width="1024" height="964">
      <feDropShadow dx="0" dy="28" stdDeviation="36" flood-color="#000000" flood-opacity="0.7"/>
    </filter>
    <linearGradient id="neonCyan" x1="300" y1="350" x2="720" y2="770" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>
  </defs>

  <!-- Squircle Base -->
  <g filter="url(#shadowC)">
    <rect x="96" y="96" width="832" height="832" rx="192" fill="url(#bgC)"/>
    <rect x="97" y="97" width="830" height="830" rx="191" stroke="url(#rimC)" stroke-width="2.5" fill="none"/>
  </g>

  <!-- Central Token Gauge Dial -->
  <g transform="translate(512, 540)">
    <!-- Dial Track -->
    <circle cx="0" cy="0" r="210" stroke="rgba(255,255,255,0.08)" stroke-width="20" stroke-dasharray="6 14" fill="none"/>
    <!-- Outer Glow Ring -->
    <path d="M 0 -210 A 210 210 0 1 1 -180 110" stroke="url(#neonCyan)" stroke-width="22" stroke-linecap="round" fill="none"/>
    <circle cx="-180" cy="110" r="11" fill="#FFFFFF"/>

    <!-- Terminal Code / Notch Inner Emblem -->
    <rect x="-110" y="-110" width="220" height="220" rx="44" fill="#000000" stroke="rgba(255,255,255,0.15)" stroke-width="2"/>

    <!-- Notch shape in the emblem -->
    <path d="M -44 -110 C -34 -110, -30 -96, -26 -84 L -22 -68 C -18 -52, -8 -44, 10 -44 L 10 -44 C 28 -44, 38 -52, 42 -68 L 46 -84 C 50 -96, 54 -110, 64 -110 Z" fill="#141519"/>

    <!-- Code Prompt: ">_" -->
    <path d="M -48 -10 L -12 24 L -48 58" stroke="#38BDF8" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="8" y1="58" x2="48" y2="58" stroke="#EA580C" stroke-width="12" stroke-linecap="round"/>
  </g>
</svg>
